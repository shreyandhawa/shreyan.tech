name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      # The build prints /cv/ to out/cv.pdf with Playwright (scripts/cv.mjs).
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          # Build-time badges call the GitHub API; the token lifts its rate limit (content/badges.ts).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Analytics (app/layout.tsx): off while the repository variable is unset. CI never sets it.
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
