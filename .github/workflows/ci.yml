name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Thresholds and pages in lighthouserc.json; reports are not uploaded.
      - run: npx @lhci/cli@0.16.1 autorun
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
